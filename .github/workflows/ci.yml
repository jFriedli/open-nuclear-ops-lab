name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Rust engine (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
        working-directory: engine
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: engine
      - run: cargo test
        working-directory: engine

  frontend:
    name: Frontend (build, unit tests, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Build WASM engine
        run: npm run build:wasm
        working-directory: app
      - name: Unit tests (vitest)
        run: npm test -- --no-watch
        working-directory: app
      - name: Production build
        run: npx ng build --base-href /${{ github.event.repository.name }}/
        working-directory: app
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: app
      - name: End-to-end tests
        run: npx playwright test
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [engine, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: npm ci
        working-directory: app
      - run: npm run build:wasm
        working-directory: app
      - name: Build for Pages
        run: npx ng build --base-href /${{ github.event.repository.name }}/
        working-directory: app
      - name: SPA fallback + Jekyll opt-out
        run: |
          cp app/dist/app/browser/index.html app/dist/app/browser/404.html
          touch app/dist/app/browser/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/app/browser
      - id: deployment
        uses: actions/deploy-pages@v4
