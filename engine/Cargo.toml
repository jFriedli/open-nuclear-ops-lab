[package]
name = "nol-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic lumped-parameter simulation engine for the Open Nuclear Ops Lab educational PWR-like simulator"
license = "MIT"
repository = "https://github.com/jFriedli/open-nuclear-ops-lab"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
